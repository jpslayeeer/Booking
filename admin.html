<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Peak and Paddle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #e9ecea; color: #18231c; padding: 20px 14px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .card { background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .header { background: #18231c; color: #fff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.4rem; font-weight: 800; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    input, select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 0.9rem; background: #fff; }
    .btn { padding: 10px 16px; border-radius: 999px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .btn-dark { background: #18231c; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-gray { background: #f3f4f6; color: #18231c; }
    .booking-item { border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-paid { background: #dcfce7; color: #166534; }
    .actions { display: flex; gap: 8px; }
    .hidden { display: none !important; }
    .pin-box { max-width: 360px; margin: 80px auto; text-align: center; }
  </style>
</head>
<body>
  <div id="login-screen" class="card pin-box">
    <h1 style="margin-bottom: 8px;">Peak & Paddle Admin</h1>
    <p style="font-size: 0.88rem; color: #6b7280; margin-bottom: 18px;">Enter your Admin PIN to manage bookings</p>
    <input type="password" id="pin-input" placeholder="Enter PIN" style="width: 100%; text-align: center; font-size: 1.1rem; margin-bottom: 14px;" />
    <button type="button" class="btn btn-dark" style="width: 100%; padding: 13px;" id="login-btn">Unlock Dashboard</button>
  </div>

  <div id="admin-screen" class="wrap hidden">
    <div class="card header">
      <div>
        <h1>Peak & Paddle — Admin</h1>
        <p style="font-size: 0.85rem; opacity: 0.8;">Manage reservations, GCash payments & court blocks</p>
      </div>
      <a href="index.html" class="btn btn-gray" style="text-decoration: none;">View Booking Page &rarr;</a>
    </div>

    <div class="card">
      <div class="controls">
        <input type="date" id="filter-date" />
        <select id="filter-court">
          <option value="ALL">All Courts</option>
          <option value="Court 1">Court 1</option>
          <option value="Court 2">Court 2</option>
        </select>
        <button type="button" class="btn btn-gray" id="show-all-btn">Show All Upcoming</button>
        <button type="button" class="btn btn-dark" id="refresh-btn">Refresh</button>
      </div>
      <div id="bookings-list"><p style="color:#6b7280; font-size:0.9rem;">Loading bookings...</p></div>
    </div>
  </div>
  <script>
    const ADMIN_CONFIG = {
      // Change your secret Admin PIN here anytime!
      adminPin: "1234",
      supabaseUrl: "https://fkvtxsyozilpuheexjio.supabase.co",
      supabaseAnonKey: "sb_publishable_ccBH2mBZycjN6RVicoy_7A_eu_Rs0ZI"
    };

    const headers = {
      "Content-Type": "application/json",
      apikey: ADMIN_CONFIG.supabaseAnonKey,
      Authorization: `Bearer ${ADMIN_CONFIG.supabaseAnonKey}`
    };

    // Simple PIN Login
    document.getElementById("login-btn").onclick = () => {
      const entered = document.getElementById("pin-input").value.trim();
      if (entered === ADMIN_CONFIG.adminPin) {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("admin-screen").classList.remove("hidden");
        loadBookings();
      } else {
        alert("Incorrect PIN. Please try again.");
      }
    };

    document.getElementById("pin-input").addEventListener("keypress", e => {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    });

    // Load Bookings from Supabase
    async function loadBookings() {
      const list = document.getElementById("bookings-list");
      list.innerHTML = `<p style="color:#6b7280; font-size:0.9rem;">Loading...</p>`;

      const dateVal = document.getElementById("filter-date").value;
      const courtVal = document.getElementById("filter-court").value;

      let url = `${ADMIN_CONFIG.supabaseUrl}/rest/v1/bookings?select=*&order=booking_date.asc,time_slot.asc`;
      if (dateVal) url += `&booking_date=eq.${dateVal}`;
      if (courtVal !== "ALL") url += `&court_name=eq.${encodeURIComponent(courtVal)}`;

      const res = await fetch(url, { headers });
      const data = await res.json();

      if (!data.length) {
        list.innerHTML = `<p style="color:#6b7280; font-size:0.9rem;">No bookings found for this filter.</p>`;
        return;
      }

      list.innerHTML = "";
      data.forEach(b => {
        const isPaid = b.status === "paid";
        const item = document.createElement("div");
        item.className = "booking-item";
        item.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:1rem; margin-bottom:4px;">
              ${b.court_name} &bull; ${b.booking_date} &bull; ${b.time_slot}
              <span class="badge ${isPaid ? "badge-paid" : "badge-pending"}" style="margin-left:6px;">${b.status}</span>
            </div>
            <div style="font-size:0.88rem; color:#374151;">
              <strong>${b.full_name}</strong> (${b.contact_no || "No contact"}) &mdash; ₱${Number(b.total_amount).toLocaleString()}
            </div>
            ${b.notes ? `<div style="font-size:0.82rem; color:#6b7280; margin-top:4px;">Notes / Ref: <strong>${b.notes}</strong></div>` : ""}
          </div>
          <div class="actions">
            ${!isPaid ? `<button class="btn btn-green" onclick="markPaid(${b.id})">Mark Paid</button>` : ""}
            <button class="btn btn-red" onclick="deleteBooking(${b.id})">Cancel / Delete</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    async function markPaid(id) {
      await fetch(`${ADMIN_CONFIG.supabaseUrl}/rest/v1/bookings?id=eq.${id}`, {
        method: "PATCH",
        headers,
        body: JSON.stringify({ status: "paid" })
      });
      loadBookings();
    }

    async function deleteBooking(id) {
      if (!confirm("Cancel and delete this booking? This will reopen the time slot for players.")) return;
      await fetch(`${ADMIN_CONFIG.supabaseUrl}/rest/v1/bookings?id=eq.${id}`, {
        method: "DELETE",
        headers
      });
      loadBookings();
    }

    document.getElementById("filter-date").onchange = loadBookings;
    document.getElementById("filter-court").onchange = loadBookings;
    document.getElementById("refresh-btn").onclick = loadBookings;
    document.getElementById("show-all-btn").onclick = () => {
      document.getElementById("filter-date").value = "";
      document.getElementById("filter-court").value = "ALL";
      loadBookings();
    };
  </script>
</body>
</html>
