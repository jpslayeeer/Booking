<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peak and Paddle | Pickleball Court Booking</title>
    <link rel="stylesheet" href="style.css" />
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-[#e9ecea] text-[#18231c] min-h-screen py-6 px-4 flex justify-center items-start font-sans">
  <div class="w-full max-w-5xl bg-[#f4f5f4] rounded-3xl overflow-hidden shadow-2xl">
    <header class="relative h-64 md:h-72 bg-cover bg-center flex flex-col justify-end p-6 md:p-10 text-white"
      style="background-image: linear-gradient(to top, rgba(15,23,18,0.88) 0%, rgba(15,23,18,0.25) 60%), url('https://unsplash.com');">
      <h1 id="ui-name" class="text-3xl md:text-5xl font-extrabold uppercase tracking-tight mb-2">PEAK AND PADDLE</h1>
      <div class="flex flex-wrap justify-between gap-2 text-sm md:text-base text-white/90 font-medium">
        <span id="ui-address">Sitio Bali-Bali, Brgy. Poblacion, Compostela, Cebu</span>
        <span id="ui-hours">Open Daily 6:00 AM - 12:00 PM</span>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-12 gap-8 p-6 md:p-10">
      <section class="md:col-span-7 md:pr-8 md:border-r border-gray-300 space-y-7">
        <div>
          <p class="text-sm font-semibold mb-3">Step 1. Select your court</p>
          <div id="court-list" class="grid grid-cols-2 gap-3"></div>
        </div>
        <div>
          <p class="text-sm font-semibold mb-3">Step 2. Select date</p>
          <div class="flex items-center gap-2">
            <button id="prev-days" type="button" class="w-8 h-8 rounded-full bg-white border border-gray-300 font-bold hover:bg-[#18231c] hover:text-white">&lsaquo;</button>
            <div id="date-list" class="grid grid-cols-5 gap-2 w-full"></div>
            <button id="next-days" type="button" class="w-8 h-8 rounded-full bg-white border border-gray-300 font-bold hover:bg-[#18231c] hover:text-white">&rsaquo;</button>
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-3">
            <p class="text-sm font-semibold">Step 3. Select time</p>
            <span id="ui-rate" class="text-xs font-medium text-gray-500">₱300 / hr</span>
          </div>
          <div id="time-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
        </div>
      </section>

      <section class="md:col-span-5 flex flex-col justify-between space-y-6">
        <div class="space-y-5">
          <div class="bg-white p-5 rounded-2xl shadow-sm flex justify-between items-center">
            <div>
              <p class="text-sm font-semibold text-gray-500">Estimated Total</p>
              <p id="ui-hours-count" class="text-xs text-gray-400 mt-0.5">0 hours selected</p>
            </div>
            <div id="ui-total" class="text-3xl font-extrabold text-[#18231c]">₱0</div>
          </div>
          <div>
            <p class="text-sm font-semibold mb-3">Step 4. Your details</p>
            <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3.5">
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Full name *</label>
                <input id="full-name" type="text" placeholder="Juan Dela Cruz" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Contact no. / Messenger *</label>
                <input id="contact-no" type="text" placeholder="0917 123 4567" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Email address (Optional)</label>
                <input id="email" type="email" placeholder="juan@email.com" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Notes / GCash Ref No. (Optional)</label>
                <textarea id="notes" rows="2" placeholder="Add special requests or GCash reference number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50"></textarea>
              </div>
            </div>
          </div>
        </div>
        <button id="review-btn" type="button" class="w-full py-4 rounded-full bg-[#18231c] hover:bg-[#25362b] text-white font-bold shadow-lg">Review booking</button>
      </section>
    </main>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-md w-full p-7 shadow-2xl">
      <h2 id="modal-title" class="text-xl font-extrabold mb-4">Review Your Booking</h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="grid grid-cols-2 gap-3 mt-6">
        <button id="close-modal" type="button" class="py-3 rounded-full bg-gray-100 font-semibold text-sm">Edit</button>
        <button id="confirm-btn" type="button" class="py-3 rounded-full bg-[#18231c] text-white font-bold text-sm">Confirm Booking</button>
      </div>
    </div>
  </div>
  <script src="app.js?v=2"></script>
</body>
</html>
